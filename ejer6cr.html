<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6 - Buscar Fibonacci con mas de 1000 divisores</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f3ed; /* Fondo beige suave */
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Alineado a la izquierda */
            justify-content: flex-start;
            padding: 30px;
            margin: 0;
        }

        table {
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(186, 168, 209, 0.2);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #e2d9eb;
            max-width: 500px; /* Tamaño más compacto */
            width: 100%;
        }

        thead td {
            background: linear-gradient(135deg, #c3aed6, #b19ffb) !important; /* Morado pastel */
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 14px;
            letter-spacing: 0.5px;
            border: none !important;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        tbody td {
            padding: 10px 14px;
            border: 1px solid #f2ecf8;
            color: #4a4453;
            font-size: 0.9rem;
        }

        button#btn-verificar {
            background-color: #b19ffb; /* Botón morado pastel */
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(177, 159, 251, 0.3);
        }

        button#btn-verificar:hover {
            background-color: #9d88f7;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(177, 159, 251, 0.4);
        }

        textarea#txt-fibonacci {
            width: 100%;
            box-sizing: border-box;
            border: 1.5px solid #e2d9eb;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            background-color: #faf8fc;
            color: #3b3345;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea#txt-fibonacci:focus {
            border-color: #b19ffb;
        }

        #resultado {
            margin-top: 18px;
            background-color: #ffffff;
            padding: 14px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(186, 168, 209, 0.15);
            max-width: 500px; /* Mismo ancho compacto */
            width: 100%;
            box-sizing: border-box;
            border-left: 5px solid #b19ffb;
        }

        #resultado p {
            margin: 6px 0;
            color: #4a4453;
            font-size: 0.9rem;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <td colspan="4" align="center" bgcolor="#CCC">Serie Fibonacci con más de 1000 divisores</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td align="center">
                    <button id="btn-verificar">Calcular</button>
                </td>
                <td colspan="3"></td>
            </tr>
            <tr>
                <td><strong>Número de Fibonacci:</strong></td>
                <td colspan="3">
                    <textarea id="txt-fibonacci" rows="4" placeholder="El resultado aparecerá aquí..." readonly></textarea>
                </td>
            </tr>
        </tbody>
    </table>

    <div id="resultado"></div>

    <script>
        const btnVerificar = document.getElementById("btn-verificar");
        const divResultado = document.getElementById("resultado");
        const txtFibonacci = document.getElementById("txt-fibonacci");

        function contarDivisores(num) {
            let contador = 0n;
            let i = 1n;
            while (i * i <= num) {
                if (num % i === 0n) {
                    if (i * i === num) {
                        contador += 1n;
                    } else {
                        contador += 2n;
                    }
                }
                i++;
            }
            return contador;
        }

        btnVerificar.addEventListener("click", function(e) {
            txtFibonacci.value = "Calculando, por favor espera...";
            
            setTimeout(() => {
                let a = 1n;
                let b = 1n;
                let divisores = 0n;
                let posicion = 2;

                while (divisores <= 1000n) {
                    let temp = a + b;
                    a = b;
                    b = temp;
                    posicion++;
                    divisores = contarDivisores(b);
                }

                divResultado.innerHTML = `
                    <p><strong>Cantidad de divisores:</strong> ${divisores.toString()}</p>
                    <p><strong>Número de Fibonacci:</strong> ${b.toString()}</p>
                `;

                txtFibonacci.value = `Cantidad de divisores: ${divisores.toString()}\nNúmero de Fibonacci: ${b.toString()}`;
            }, 100);
        });
    </script>
</body>
</html>
